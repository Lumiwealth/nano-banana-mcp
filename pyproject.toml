[project]
name = "image-generator-mcp"
version = "0.2.0"
description = "Provider-neutral, cost-controlled MCP image generation"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.28.0",
    "openai>=2.0.0",
    "Pillow>=10.0.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8.0"]
